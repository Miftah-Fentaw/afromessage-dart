name: afromessage_dart
description: >
  unofficial Dart/Flutter client for AfroMessage — Ethiopia's SMS API.
  Send SMS, bulk SMS, OTPs, and verify security codes.
version: 1.0.2
repository: https://github.com/Miftah-Fentaw/afromessage-dart
homepage: https://afromessage.com/developers
documentation: https://github.com/Miftah-Fentaw/afromessage-dart#readme
issue_tracker: https://github.com/Miftah-Fentaw/afromessage-dart/issues
topics:
  - sms
  - ethiopia
  - afromessage
  - otp
  - flutter
screenshots:
  screenshots:
  - description: 'afromessage_dart logo'
    path: assets/logo.png
  - description: 'SMS tab demo'
    path: assets/SMS.png
  - description: 'OTP tab demo'
    path: assets/OTP.png
environment:
  sdk: ^3.0.0

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
