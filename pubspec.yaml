name: afromessage_dart
description: >
  unofficial Dart/Flutter client for AfroMessage — Ethiopia's SMS API.
  Send SMS, bulk SMS, OTPs, and verify security codes.
version: 1.0.0
repository: https://github.com/Miftah-Fentaw/afromessage-dart
homepage: https://afromessage.com/developers
topics:
  - sms
  - ethiopia
  - afromessage
  - otp
  - flutter

environment:
  sdk: ^3.0.0

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
